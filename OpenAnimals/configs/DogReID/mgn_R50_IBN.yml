_BASE_: ../Base-bagtricks.yml

DATASETS:
  NAMES: ("DogReID",)
  TESTS: ("DogReID",)

OUTPUT_DIR: logs/DogReID/mgn

INPUT:
  SIZE_TRAIN: [ 384, 384 ]
  SIZE_TEST: [ 384, 384 ]

  REA:
    ENABLED: False
    PROB: 0.5

MODEL:
  META_ARCHITECTURE: MGN

  BACKBONE:
    DEPTH: 50x
    WITH_IBN: True

SOLVER:
  MAX_EPOCH: 120
  SCHED: CosineAnnealingLR
  DELAY_EPOCHS: 60
  ETA_MIN_LR: 0.0000007
  CHECKPOINT_PERIOD: 20

TEST:
  EVAL_PERIOD: 20
